[project]
name = "quotes-api"
version = "0.1.0"
description = "Sample FastAPI service used to demonstrate an agentic engineering setup."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Cuesta" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.143.0", "uvicorn>=0.54.0", "pydantic>=2.14.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.0", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
